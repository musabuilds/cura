name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Unit + API tests
        run: uv run pytest
      - name: Validate dataset
        run: uv run cura validate
      - name: Dataset is reproducible from staging
        # Re-running the merge on the committed staging files must not change the committed dataset.
        run: |
          uv run cura merge > /dev/null
          git diff --stat --exit-code -- data/facilities.jsonl data/practitioners.jsonl data/roles.jsonl

  postgres:
    # The same suite on the production database: Postgres 16 + pgvector, schema built by the migrations.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cura
          POSTGRES_PASSWORD: cura
          POSTGRES_DB: cura_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cura" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      CURA_TEST_POSTGRES_URL: postgresql+psycopg://cura:cura@localhost:5432/cura_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: API tests on Postgres + pgvector
        run: uv run pytest
