name: refresh

# Scripted, non-AI sources (OpenStreetMap, Wikidata) daily. Nothing is pushed to main directly: every
# refresh opens a pull request that CI validates and a maintainer merges. Facilities and doctors keep
# their own records current through the API; their edits outrank every scripted source at merge.
on:
  schedule:
    - cron: "17 2 * * *"   # daily 02:17 UTC (05:17 Amman)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Scripted collectors
        run: |
          uv run cura collect osm
          uv run cura collect wikidata
      - name: Merge + validate
        run: |
          uv run cura merge
          uv run cura validate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          delete-branch: true
          commit-message: "data: scheduled refresh"
          title: "data: scheduled refresh"
          body: |
            Automated refresh of scripted sources (OSM, Wikidata).
            Review `data/manifest.json` counts and the diff before merging. CI re-validates.
          labels: data
