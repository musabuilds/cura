# Local production-like stack: Postgres (with pgvector) + migrations + API + embedding worker.
#   docker compose up -d --build
#   docker compose exec api cura db seed
#   docker compose exec api cura db create-admin --email you@example.com --password '...'
services:
  db:
    image: pgvector/pgvector:pg16  # Postgres 16 + the vector extension
    environment:
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: cura
      POSTGRES_DB: cura
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura"]
      interval: 5s
      retries: 10

  # One-shot: brings the schema to the latest migration before any API replica starts.
  migrate:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      CURA_DATABASE_URL: postgresql+psycopg://cura:cura@db:5432/cura
    command: ["cura", "db", "upgrade"]
    restart: "no"

  api:
    build: .
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      CURA_DATABASE_URL: postgresql+psycopg://cura:cura@db:5432/cura
      CURA_JWT_SECRET: ${CURA_JWT_SECRET:?set CURA_JWT_SECRET in .env}
      CURA_PUBLIC_BASE_URL: ${CURA_PUBLIC_BASE_URL:-http://localhost:8000}
      CURA_ENVIRONMENT: production
      CURA_EMBED_PROVIDER: ${CURA_EMBED_PROVIDER:-none}
      CURA_EMBED_BASE_URL: ${CURA_EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
      CURA_EMBED_MODEL: ${CURA_EMBED_MODEL:-bge-m3}
      CURA_EMBED_API_KEY: ${CURA_EMBED_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach an embedding server on the host
    ports: ["8000:8000"]

  # Keeps the semantic index current: embeds records whose version moved. Writes never wait on it.
  # Off unless CURA_EMBED_PROVIDER is set (e.g. openai + an Ollama/vLLM/TEI endpoint serving bge-m3).
  embedder:
    build: .
    profiles: ["search"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      CURA_DATABASE_URL: postgresql+psycopg://cura:cura@db:5432/cura
      CURA_EMBED_PROVIDER: ${CURA_EMBED_PROVIDER:-openai}
      CURA_EMBED_BASE_URL: ${CURA_EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
      CURA_EMBED_MODEL: ${CURA_EMBED_MODEL:-bge-m3}
      CURA_EMBED_API_KEY: ${CURA_EMBED_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["cura", "embed", "sync", "--watch", "30"]
    restart: unless-stopped

volumes:
  pgdata:
