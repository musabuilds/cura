# Local production-like stack: Postgres + API.
#   docker compose up -d --build
#   docker compose exec api cura db seed
#   docker compose exec api cura db create-admin --email you@example.com --password '...'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: cura
      POSTGRES_DB: cura
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      CURA_DATABASE_URL: postgresql+psycopg://cura:cura@db:5432/cura
      CURA_JWT_SECRET: ${CURA_JWT_SECRET:?set CURA_JWT_SECRET in .env}
      CURA_PUBLIC_BASE_URL: ${CURA_PUBLIC_BASE_URL:-http://localhost:8000}
      CURA_ENVIRONMENT: production
    ports: ["8000:8000"]

volumes:
  pgdata:
