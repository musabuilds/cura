[project]
name = "cura"
version = "0.1.0"
description = "Open, continuously updated registry of Jordan's healthcare facilities, practitioners and services — dataset, pipeline and API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "NextMove", email = "musab@stridebs.com" }]
dependencies = [
    "pydantic[email]>=2.9",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "shapely>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "alembic>=1.14",
    "pgvector>=0.3",
    "cryptography>=43",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
cura = "cura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cura"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/cura/api/routes/auth.py" = ["E501"]  # inline HTML for the consent page
"tests/*" = ["E501"]
